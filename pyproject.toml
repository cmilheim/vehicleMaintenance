[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehiclelog"
version = "0.1.0"
description = "Personal vehicle maintenance tracking application"
requires-python = ">=3.11"
dependencies = [
    "flet",
]

[tool.setuptools.packages.find]
where = ["src"]